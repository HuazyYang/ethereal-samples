# nv_asteroids shaders, shader model 6.0 -- every stage except the SM 6.5
# meshlet amplification/mesh shaders (shaders_sm65.cfg).
#
# 6.0 is deliberate, not a leftover: from SM 6.2 ShaderTool passes
# -enable-16bit-types, which changes `min16float` from the 2018 "may be 32-bit"
# semantics to real 16-bit and alters the arithmetic of the surface, lighting
# and fog shaders. The 2018 demo compiled these with DXC 1.2 at 6.0.
#
# Rows are relative to this file's directory; the blob of each row lands at
# <bin>/shaders/nv_asteroids/dxil/<dir>/<stem>[_<entry>].bin.
#
# Verification notes: demo/space_shaders.NOTES.md, demo/surface_shaders.NOTES.md,
# demo/meshlet_shaders.NOTES.md, framework/framework_shaders.NOTES.md

# --- meshlets: Hi-Z pyramid ------------------------------------------------
demo/create_hi_z_cs.hlsl            -T cs -E main

# --- meshlets: the original NVAPI mesh-shader path (VS-stage shaders with the
#     g_NvidiaExt ops; selected by -meshShaders nvapi) ----------------------
demo/nvapi/asteroidTS.hlsl          -T vs -E ts_main -D DEPTH_PRE_PASS={0,1} -D _MESHLETS_HI_Z={0,1}
demo/nvapi/asteroidMS.hlsl          -T vs -E ms_main -D DEPTH_PRE_PASS={0,1}
demo/nvapi/basicTS.hlsl             -T vs -E ts_main -D DEPTH_PRE_PASS={0,1} -D _MESHLETS_HI_Z=0
demo/nvapi/basicMS.hlsl             -T vs -E ms_main -D DEPTH_PRE_PASS={0,1}
demo/nvapi/debugTS.hlsl             -T vs -E ts_main -D DEPTH_PRE_PASS=0 -D _MESHLETS_HI_Z=0
demo/nvapi/debugMS.hlsl             -T vs -E ms_main -D DEPTH_PRE_PASS=0
demo/nvapi/particles.hlsl           -T vs -E ms_main

# --- surface: forward / G-buffer / material id / deferred lighting ---------
demo/forward_ps.hlsl                -T ps -E main -D IS_SHIP={0,1} -D _ASTEROIDS={0,1}
demo/gbuffer_ps.hlsl                -T ps -E main -D IS_SHIP={0,1} -D _ASTEROIDS={0,1}
demo/material_id_ps.hlsl            -T ps -E main -D IS_SHIP={0,1} -D _ASTEROIDS={0,1}
demo/deferred_lighting_ps.hlsl      -T ps -E main
demo/shield_ps.hlsl                 -T ps -E main
demo/accumulation_ps.hlsl           -T ps -E main

# --- space effects: stars, starfield, sun, planets, lens flare, fog, ... ---
demo/real_stars_vs.hlsl             -T vs -E VS
demo/real_stars_ps.hlsl             -T ps -E PS
demo/texturedstarfield_ps.hlsl      -T ps -E main
demo/RectPass_vs.hlsl               -T vs -E main
demo/sun_disk_ps.hlsl               -T ps -E main
demo/PlanetFx_on_ps.hlsl            -T ps -E main
demo/PlanetWithRingsFx_on_ps.hlsl   -T ps -E main
demo/lensflare.hlsl                 -T vs -E vs_main
demo/lensflare.hlsl                 -T ps -E ps_main
demo/fog.hlsl                       -T ps -E ps_trace
demo/fog.hlsl                       -T ps -E ps_filter
demo/particles.hlsl                 -T vs -E vs_main
demo/particles.hlsl                 -T ps -E ps_main
demo/particles.hlsl                 -T cs -E update_cs_main
demo/hq_blit_ps.hlsl                -T ps -E main
demo/show_cubemap_ps.hlsl           -T ps -E main

# --- 2018 framework passes ------------------------------------------------
# ShaderTool only allows permutation braces in -D values, so the rows that used
# -E {a,b} in the ShaderMake config are written out one entry point per row.
framework/passes/gbuffer_vs.hlsl    -T vs -E main -D SINGLE_PASS_STEREO={0,1} -D MOTION_VECTORS={0,1}
framework/passes/forward_vs.hlsl    -T vs -E main -D SINGLE_PASS_STEREO={0,1}
framework/passes/forward_gs.hlsl    -T gs -E main -D MOTION_VECTORS={0,1}
framework/passes/cubemap_gs.hlsl    -T gs -E main
framework/passes/material_id_ps.hlsl -T ps -E main
framework/passes/material_id_ps.hlsl -T ps -E main_alpha_tested
framework/passes/depth_vs.hlsl      -T vs -E main
framework/passes/depth_ps.hlsl      -T ps -E main
framework/passes/light_probe.hlsl   -T gs -E cubemap_gs
framework/passes/light_probe.hlsl   -T ps -E mip_ps
framework/passes/light_probe.hlsl   -T ps -E diffuse_probe_ps
framework/passes/light_probe.hlsl   -T ps -E specular_probe_ps
framework/passes/light_probe.hlsl   -T ps -E environment_brdf_ps
framework/passes/histogram_cs.hlsl  -T cs -E main -D HISTOGRAM_BINS=256 -D SOURCE_ARRAY={0,1}
framework/passes/exposure_cs.hlsl   -T cs -E main -D HISTOGRAM_BINS=256 -D SOURCE_ARRAY={0,1}
framework/passes/tonemapping_ps.hlsl -T ps -E main -D HISTOGRAM_BINS=256 -D SOURCE_ARRAY={0,1}
framework/passes/bloom_ps.hlsl      -T ps -E main
framework/sharpen_ps.hlsl           -T ps -E main
framework/passes/taa_cs.hlsl        -T cs -E main -D SAMPLE_COUNT=1 -D USE_CATMULL_ROM_FILTER={0,1}
