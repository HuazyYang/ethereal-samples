# nv_asteroids shaders, shader model 6.5 -- the meshlet amplification/mesh stages.
#
# ShaderTool takes the shader model per invocation, not per row (there is no -m
# flag), so the demo's shaders are split into this group and shaders_sm60.cfg.
# Only the stages that need SM 6.5 are here: everything else stays at 6.0, where
# DXC does not enable 16-bit types and `min16float` keeps its 2018 semantics.
#
# Rows are relative to this file's directory; the blob of each row lands at
# <bin>/shaders/nv_asteroids/dxil/<dir>/<stem>[_<entry>].bin.
#
# Verification notes: demo/meshlet_shaders.NOTES.md

demo/asteroidTS.hlsl    -T as -E ts_main -D DEPTH_PRE_PASS={0,1} -D _MESHLETS_HI_Z={0,1}
demo/asteroidMS.hlsl    -T ms -E ms_main -D DEPTH_PRE_PASS={0,1}
demo/basicTS.hlsl       -T as -E ts_main -D DEPTH_PRE_PASS={0,1} -D _MESHLETS_HI_Z=0
demo/basicMS.hlsl       -T ms -E ms_main -D DEPTH_PRE_PASS={0,1}
demo/debugTS.hlsl       -T as -E ts_main -D DEPTH_PRE_PASS=0 -D _MESHLETS_HI_Z=0
demo/debugMS.hlsl       -T ms -E ms_main -D DEPTH_PRE_PASS=0
demo/particles_ms.hlsl  -T ms -E ms_main
